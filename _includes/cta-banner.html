<section class="cta-banner">
    <div class="container">
        <div class="cta-banner-inner">
            <h2>{{ include.title | default: "Let's Talk" }}</h2>
            <p>{{ include.subtitle | default: "I'm always open to a conversation about insurance, technology, or what's next." }}</p>
            <a href="{{ '/contact/' | relative_url }}" class="btn btn-accent">{{ include.button | default: "Get in Touch" }} &rarr;</a>
            {% if include.fine_print %}<p class="cta-fine-print">{{ include.fine_print }}</p>{% endif %}
        </div>
    </div>
</section>
