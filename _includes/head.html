<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% seo %}
{% if page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}

<!-- Content Security Policy: whitelist known external script/resource domains -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com;
  style-src 'self' 'unsafe-inline';
  font-src 'self';
  img-src 'self' data: https://www.googletagmanager.com;
  connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com https://region1.google-analytics.com;
">

<!-- Favicon -->
<link rel="icon" href="{{ '/assets/images/favicon.png' | relative_url }}" sizes="32x32">
<link rel="icon" href="{{ '/assets/images/favicon.png' | relative_url }}" sizes="192x192">
<link rel="apple-touch-icon" href="{{ '/assets/images/favicon.png' | relative_url }}">

<!-- Stylesheet -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

<!-- WebSite Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Breezy Risk Advisors",
  "url": "{{ site.url }}",
  "description": "{{ site.description }}",
  "publisher": { "@id": "{{ site.url }}/#organization" }
}
</script>

<!-- Site Identity Schema (canonical: ProfessionalService + Person) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "ProfessionalService",
      "@id": "{{ site.url }}/#organization",
      "name": "{{ site.title }}",
      "url": "{{ site.url }}",
      "logo": "{{ site.url }}/assets/images/breezy-logo.png",
      "image": "{{ site.url }}/assets/images/breezy-og-default.png",
      "description": "{{ site.description }}",
      "foundingDate": "2024",
      "founder": { "@id": "{{ site.url }}/#joerg" },
      "email": "{{ site.email }}",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "{{ site.email }}"
      },
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "US"
      },
      "areaServed": {
        "@type": "Country",
        "name": "United States"
      },
      "serviceType": [
        "Investor Advisory",
        "Insurance Due Diligence",
        "AI Liability Advisory",
        "Carrier Technology Strategy",
        "MGA Operations Advisory",
        "AI and Emerging Risk Analysis",
        "Insurance Technology Advisory",
        "Coverage Architecture",
        "Independent Insurance Advisory",
        "Cyber Insurance Analysis"
      ],
      "slogan": "Insurance strategy, technology, and operations advisory. Carrier technology strategy, MGA operations, and emerging risk analysis.",
      "audience": [
        { "@type": "Audience", "audienceType": "Insurance Carriers" },
        { "@type": "Audience", "audienceType": "Managing General Agents (MGAs)" },
        { "@type": "Audience", "audienceType": "Insurance Investors" }
      ],
      "knowsAbout": [
        "Insurance Technology",
        "Carrier Technology Strategy",
        "MGA Operations",
        "AI Liability Insurance",
        "Emerging Risk",
        "Parametric Insurance",
        "Coverage Architecture",
        "Cyber Insurance",
        "D&O Insurance",
        "Insurance M&A",
        "Insurance Due Diligence",
        "MGA Capacity Economics"
      ],
      "sameAs": [
        "https://www.linkedin.com/company/breezy-risk-advisors"
      ]
    },
    {
      "@type": "Person",
      "@id": "{{ site.url }}/#joerg",
      "name": "{{ site.author }}",
      "jobTitle": "Founder & Principal",
      "url": "{{ site.url }}/about/",
      "image": "{{ site.url }}/assets/images/joerg-portrait.jpg",
      "description": "Founder and Principal of Breezy Risk Advisors. Insurance technology leader spanning carriers (Chubb, CNA), insurtech startups, and MGAs. Founded a parametric insurance startup. Served as COO of a cyber insurance MGA. Early career in cybersecurity at Siemens. Master's in Electrical Engineering, MBA from London Business School. Advises investors, carriers, and startups on insurance strategy, technology, and operations. Does not sell, place, or broker insurance.",
      "worksFor": { "@id": "{{ site.url }}/#organization" },
      "alumniOf": [
        { "@type": "CollegeOrUniversity", "name": "Karlsruhe Institute of Technology" },
        { "@type": "CollegeOrUniversity", "name": "London Business School" }
      ],
      "hasCredential": [
        {
          "@type": "EducationalOccupationalCredential",
          "credentialCategory": "degree",
          "name": "MBA",
          "recognizedBy": { "@type": "EducationalOrganization", "name": "London Business School" }
        },
        {
          "@type": "EducationalOccupationalCredential",
          "credentialCategory": "degree",
          "name": "Master's in Electrical Engineering"
        }
      ],
      "knowsAbout": [
        "Insurance Technology",
        "Carrier Technology Strategy",
        "MGA Operations",
        "AI Liability Insurance",
        "Cyber Insurance",
        "Insurance Due Diligence",
        "Coverage Architecture",
        "Parametric Insurance",
        "Cybersecurity"
      ],
      "sameAs": [
        "{{ site.linkedin }}"
      ]
    },
    {
      "@type": "OpinionNewsArticle",
      "@id": "{{ site.url }}/#itl-ai-pricing",
      "headline": "How Can We Price AI's Risks?",
      "url": "https://www.insurancethoughtleadership.com/ai-machine-learning/how-can-we-price-ais-risks",
      "datePublished": "2026-11-06",
      "image": "{{ site.url }}/assets/images/breezy-og-default.png",
      "author": { "@id": "{{ site.url }}/#joerg" },
      "publisher": {
        "@type": "NewsMediaOrganization",
        "name": "Insurance Thought Leadership",
        "url": "https://www.insurancethoughtleadership.com"
      }
    },
    {
      "@type": "OpinionNewsArticle",
      "@id": "{{ site.url }}/#itl-ai-liability",
      "headline": "Insurers Struggle to Price AI Liability Coverage",
      "url": "https://www.insurancethoughtleadership.com/ai-machine-learning/insurers-struggle-price-ai-liability-coverage",
      "datePublished": "2026-09-10",
      "image": "{{ site.url }}/assets/images/breezy-og-default.png",
      "author": { "@id": "{{ site.url }}/#joerg" },
      "publisher": {
        "@type": "NewsMediaOrganization",
        "name": "Insurance Thought Leadership",
        "url": "https://www.insurancethoughtleadership.com"
      }
    },
    {
      "@type": "OpinionNewsArticle",
      "@id": "{{ site.url }}/#bankthink-cyber-minefield",
      "headline": "Your bank's cyber insurance policies are a minefield of uncertainty",
      "url": "https://www.americanbanker.com/opinion/your-banks-cyber-insurance-policies-are-a-minefield-of-uncertainty",
      "datePublished": "2026-07-28",
      "image": "{{ site.url }}/assets/images/breezy-og-default.png",
      "author": { "@id": "{{ site.url }}/#joerg" },
      "publisher": {
        "@type": "NewsMediaOrganization",
        "name": "American Banker",
        "url": "https://www.americanbanker.com"
      }
    }
  ]
}
</script>
